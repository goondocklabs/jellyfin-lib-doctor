# Releases happen on their own: bump the version in meta.json (and the .csproj) and push to main.
# This builds the plugin, creates the GitHub release v<version> with the zip, and adds it to
# manifest.json (the plugin repository Jellyfin reads). You can also run it by hand from the Actions tab.
name: Release

on:
  push:
    branches: [main]
    paths: ['meta.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('meta.json'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released — nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Check versions match
        if: env.SKIP != '1'
        run: python3 .github/scripts/check_version.py "$VERSION"

      - uses: actions/setup-dotnet@v4
        if: env.SKIP != '1'
        with:
          dotnet-version: '10.0.x'

      - name: Build
        if: env.SKIP != '1'
        run: dotnet build Jellyfin.Plugin.LibraryDoctor.csproj -c Release -o out

      - name: Package
        if: env.SKIP != '1'
        run: |
          mkdir pkg
          cp out/Jellyfin.Plugin.LibraryDoctor.dll meta.json logo.png pkg/
          (cd pkg && zip -j "../library-doctor_${VERSION}.zip" *)

      - name: Create the release with the zip
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/release_notes.py > notes.md
          gh release create "v${VERSION}" "library-doctor_${VERSION}.zip" --target "$GITHUB_SHA" --title "Library Doctor ${VERSION}" --notes-file notes.md

      - name: Add version to manifest.json
        if: env.SKIP != '1'
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 .github/scripts/update_manifest.py "$VERSION" "library-doctor_${VERSION}.zip" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/library-doctor_${VERSION}.zip" \
            pkg/meta.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Manifest: add ${VERSION}"
          git push origin main
